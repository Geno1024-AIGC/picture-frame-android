name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      version_name: ${{ steps.version.outputs.version_name }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Test
        run: ./gradlew testDebugUnitTest

      - name: Lint
        # The variant that ships. Minification and resource shrinking can only
        # surface problems on release.
        run: ./gradlew lintRelease

      - name: Materialize keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        # Fail loudly rather than publish an unsigned APK, which the platform
        # would refuse to install over an existing one.
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 is not available to this repository. Authorize the org secret under RULES/KEYSTORE.md."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"

      - name: Assemble signed release APK
        env:
          KEYSTORE_STORE_FILE: ${{ runner.temp }}/keystore.jks
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
        run: |
          ./gradlew assembleRelease \
            -PcanaryRunNumber=${{ github.run_number }} \
            -PcanaryCommit=${{ github.sha }}

      - name: Verify the APK is signed
        # The build is allowed to produce an unsigned APK locally, so assert here
        # that CI did not silently do the same.
        run: |
          set -euo pipefail
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)"
          "$apksigner" verify --print-certs \
            app/build/outputs/apk/release/app-release.apk | grep -E '^Signer #1 certificate (DN|SHA-256)'

      - name: Read version name
        id: version
        # The same properties the APK was built with. Without them this reports
        # the local default and the release ends up titled as a different build.
        run: |
          echo "version_name=$(./gradlew -q printVersionName \
            -PcanaryRunNumber=${{ github.run_number }} \
            -PcanaryCommit=${{ github.sha }})" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  pre-release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v8
        with:
          name: app-release
          path: apk

      - name: Publish rolling pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: canary
          VERSION: ${{ needs.build.outputs.version_name }}
          FULL_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          short_sha="${FULL_SHA:0:8}"
          apk=apk/app-release.apk
          subject="$(git log -1 --pretty=%s)"
          notes="$(printf 'Build #%s, commit `%s`.\n\n%s\n\nSigned release APK for testing, not for distribution.' \
            "$RUN_NUMBER" "$short_sha" "$subject")"
          title="$VERSION canary"

          # The in-app updater reads this manifest to learn the run number and the
          # expected digest. It is tiny, so the app always fetches it from GitHub
          # directly and only proxies the APK itself.
          size="$(stat -c%s "$apk")"
          digest="$(sha256sum "$apk" | cut -d' ' -f1)"
          printf '%s\n' \
            'runNumber='"$RUN_NUMBER" \
            'versionName='"$VERSION" \
            'sizeBytes='"$size" \
            'sha256='"$digest" \
            'assetName=app-release.apk' \
            'commit='"$FULL_SHA" \
            > apk/canary.properties

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$apk" apk/canary.properties --clobber
            gh release edit "$TAG" --title "$title" --notes "$notes" --prerelease
          else
            gh release create "$TAG" "$apk" apk/canary.properties \
              --title "$title" \
              --notes "$notes" \
              --prerelease \
              --target "$FULL_SHA"
          fi

          # Canaries up to #13 published a debug APK under this same rolling tag.
          # Drop it so the release lists only what is current.
          gh release delete-asset "$TAG" app-debug.apk --yes 2>/dev/null || true
