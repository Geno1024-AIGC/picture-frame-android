name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      version_name: ${{ steps.version.outputs.version_name }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Test
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      - name: Assemble debug APK
        run: |
          ./gradlew assembleDebug \
            -PcanaryRunNumber=${{ github.run_number }} \
            -PcanaryCommit=${{ github.sha }}

      - name: Read version name
        id: version
        # The same properties the APK was built with. Without them this reports
        # the local default and the release ends up titled as a different build.
        run: |
          echo "version_name=$(./gradlew -q printVersionName \
            -PcanaryRunNumber=${{ github.run_number }} \
            -PcanaryCommit=${{ github.sha }})" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  pre-release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v8
        with:
          name: app-debug
          path: apk

      - name: Publish rolling pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: canary
          VERSION: ${{ needs.build.outputs.version_name }}
          FULL_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          short_sha="${FULL_SHA:0:8}"
          apk=apk/app-debug.apk
          subject="$(git log -1 --pretty=%s)"
          notes="$(printf 'Build #%s, commit `%s`.\n\n%s\n\nDebug APK, not for distribution.' \
            "$RUN_NUMBER" "$short_sha" "$subject")"
          title="$VERSION canary"

          # The in-app updater reads this manifest to learn the run number and the
          # expected digest. It is tiny, so the app always fetches it from GitHub
          # directly and only proxies the APK itself.
          size="$(stat -c%s "$apk")"
          digest="$(sha256sum "$apk" | cut -d' ' -f1)"
          printf '%s\n' \
            'runNumber='"$RUN_NUMBER" \
            'versionName='"$VERSION" \
            'sizeBytes='"$size" \
            'sha256='"$digest" \
            'assetName=app-debug.apk' \
            'commit='"$FULL_SHA" \
            > apk/canary.properties

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$apk" apk/canary.properties --clobber
            gh release edit "$TAG" --title "$title" --notes "$notes" --prerelease
          else
            gh release create "$TAG" "$apk" apk/canary.properties \
              --title "$title" \
              --notes "$notes" \
              --prerelease \
              --target "$FULL_SHA"
          fi
