name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      version_name: ${{ steps.version.outputs.version_name }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Test
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Read version name
        id: version
        run: echo "version_name=$(./gradlew -q printVersionName)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  pre-release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: app-debug
          path: apk

      - name: Publish rolling pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: canary
          VERSION: ${{ needs.build.outputs.version_name }}
          FULL_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          short_sha="${FULL_SHA:0:8}"
          notes="$(printf 'Build #%s, commit `%s`.\n\nDebug APK, not for distribution.' \
            "$RUN_NUMBER" "$short_sha")"
          title="$VERSION canary #$RUN_NUMBER"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" apk/app-debug.apk --clobber
            gh release edit "$TAG" --title "$title" --notes "$notes" --prerelease
          else
            gh release create "$TAG" apk/app-debug.apk \
              --title "$title" \
              --notes "$notes" \
              --prerelease \
              --target "$FULL_SHA"
          fi
